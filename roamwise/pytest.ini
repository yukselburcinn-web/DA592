[pytest]
markers =
    slow: runs the full planning pipeline -- a trip plan, a multi-day TOPTW
        solve, a retriever build, or the comparative analysis. 29 of the 161
        tests carry it and they are most of the suite's wall time (#148).
        Deselect with `-m "not slow"`; CI does that only for pull requests
        that leave the retrieval/graph/agent/optimization layers alone.
