name: Tests

on:
  push:
    branches: [main]
    # A commit that only edits documentation cannot break the suite, and this
    # repo makes a lot of them -- 15 of the last 60 non-merge commits touched
    # nothing but .md, and each one spent a full run (~17 min) proving it.
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; pushes to main are not, so every commit
  # on the default branch still gets its own recorded result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scope step below diffs against the PR's base commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            roamwise/requirements.txt
            roamwise/requirements-langgraph.txt

      # retrieval/semantic_search.py downloads all-MiniLM-L6-v2 (~80MB) on
      # first use. Without this it came down on every single run.
      - name: Cache the sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('roamwise/requirements.txt') }}
          restore-keys: hf-

      - name: Install dependencies
        run: |
          pip install -r roamwise/requirements.txt
          # Optional extra (not part of requirements.txt / not installed by
          # local devs by default) -- installed here so CI actually runs the
          # LangGraph-orchestrator test instead of skipping it.
          pip install -r roamwise/requirements-langgraph.txt
          pip install pytest

      # The `slow` tests (#148) are the ones that run a full trip plan, and
      # what they guard is the planning stack: retrieval, the graph, the
      # agents, the solver. A pull request that leaves all four alone cannot
      # break them, so it runs the fast subset and gets its answer in a
      # fraction of the time. Anything else -- and every push to main -- runs
      # all 161. Nothing reaches the default branch without the full suite.
      - name: Decide which tests this change needs
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "Full suite: $GITHUB_EVENT_NAME, not a pull request."
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          echo "Changed files:"; echo "$changed"
          if echo "$changed" | grep -qE '^roamwise/(knowledge_graph|retrieval|agents|optimization)/'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "Full suite: this PR touches a layer the slow tests exist to guard."
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "Fast subset: nothing under knowledge_graph/ retrieval/ agents/ optimization/."
          fi

      - name: Run test suite
        if: steps.scope.outputs.full == 'true'
        run: |
          cd roamwise
          pytest tests/ -v

      - name: Run test suite (fast subset)
        if: steps.scope.outputs.full != 'true'
        run: |
          cd roamwise
          pytest tests/ -v -m "not slow"
